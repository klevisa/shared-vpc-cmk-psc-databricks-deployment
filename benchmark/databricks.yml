bundle:
  name: benchmark

# One pyspark file == one single-task job. Compute + retries + failure email + the
# project/engine tags are all variables, so the SAME bundle runs the Photon pass, the
# Spark baseline, and (later) promotes dev -> prod without code changes.
variables:
  # Engine: PHOTON or STANDARD (drives runtime_engine). engine_tag is its lowercase label.
  engine:
    default: PHOTON
  engine_tag:
    default: photon
  project_tag:
    default: dataproc-vs-photon

  # Compute — match these to the Dataproc cluster for a fair comparison.
  spark_version:
    default: 15.4.x-scala2.12
  driver_node_type_id:
    default: n2-highmem-8
  node_type_id:
    default: n2-highmem-8
  num_workers:
    default: 4

  # Reliability
  max_retries:
    default: 1
  failure_email:
    default: benchmark-alerts@example.com

  # Workload size (passed to the job as a Spark conf)
  benchmark_rows:
    default: "100000000"

  # --- results + GCP billing (collector; see src/collect_dbx.py) ---
  results_table:
    default: analytics.benchmark.results
  photon_coverage_table:
    default: analytics.benchmark.photon_coverage # sample_job records per-run Photon coverage here; collect_dbx joins it
  bq_billing_view:
    default: billing-project.benchmark_billing.vm_cost_by_run # scoped authorized view
  gcp_project:
    default: example-databricks-svc
  # Keyless collector: the collector SA is attached to the job cluster (gcp_attributes) and
  # the code reads BigQuery via ADC. No SA keys, no secret scopes.
  collector_sa:
    default: gcp-data-collector@example-databricks-svc.iam.gserviceaccount.com
  # Zero-role node SA (workspace-setup/service-project/node-sa.tf) — the identity workload
  # clusters run as. With collector_sa it forms the cluster-policy allow-list (see
  # resources/cluster_policy.yml). PoC scope: just these two; Yahoo extends the list in prod.
  node_sa:
    default: databricks-node-sa@example-databricks-svc.iam.gserviceaccount.com

  # --- dashboard ---
  warehouse_id:
    default: 0123456789abcdef # SQL warehouse the Lakeview dashboard runs on

  # --- service principals (run-as). Set to each SP's application id (see prerequisites.md).
  # Separation of duties: runner runs the workloads, collector materializes results, analyst builds dashboards. ---
  runner_sp:
    default: 00000000-0000-0000-0000-00000000aaaa # bench-runner
  collector_sp:
    default: 00000000-0000-0000-0000-00000000bbbb # bench-collector
  analyst_sp:
    default: 00000000-0000-0000-0000-00000000cccc # bench-analyst (dashboard owner)

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://1234567890123456.7.gcp.databricks.com
  prod:
    mode: production
    workspace:
      host: https://1234567890123456.7.gcp.databricks.com
