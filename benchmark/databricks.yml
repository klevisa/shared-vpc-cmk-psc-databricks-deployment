bundle:
  name: benchmark

# One pyspark file == one single-task job. Compute + retries + failure email + the
# project/engine tags are all variables, so the SAME bundle runs the Photon pass, the
# Spark baseline, and (later) promotes dev -> prod without code changes.
variables:
  # Engine: PHOTON or STANDARD (drives runtime_engine). engine_tag is its lowercase label.
  engine:
    default: PHOTON
  engine_tag:
    default: photon
  project_tag:
    default: dataproc-vs-photon

  # Compute — match these to the Dataproc cluster for a fair comparison.
  spark_version:
    default: 15.4.x-scala2.12
  driver_node_type_id:
    default: n2-highmem-8
  node_type_id:
    default: n2-highmem-8
  num_workers:
    default: 4

  # Reliability
  max_retries:
    default: 1
  failure_email:
    default: benchmark-alerts@example.com

  # Workload size (passed to the job as a Spark conf)
  benchmark_rows:
    default: "100000000"

  # --- results + GCP billing (collectors; see src/collect_*.py) ---
  results_table:
    default: analytics.benchmark.results
  bq_billing_view:
    default: billing-project.benchmark_billing.vm_cost_by_run # scoped authorized view
  gcp_project:
    default: example-databricks-svc
  dataproc_region:
    default: us-central1
  secret_scope:
    default: benchmark
  # Two GCP SA keys live in the secret scope; each Databricks SP reads only its own.
  dataproc_runner_secret_key:
    default: gcp_dataproc_runner_key # read by bench-runner (submits Dataproc)
  data_collector_secret_key:
    default: gcp_data_collector_key # read by bench-collector (runtimes + billing)

  # --- Dataproc submit (orchestrated from Databricks by bench-runner; see src/submit_dataproc.py) ---
  dataproc_cluster:
    default: example-dataproc-cluster # the client's existing Dataproc cluster
  dataproc_pyspark_uri:
    default: gs://example-analytics-data/benchmark/sample_job.py # the same file, staged on GCS for Dataproc
  data_collector_sa:
    default: data-collector@example-databricks-svc.iam.gserviceaccount.com # granted jobs.get per job
  dataproc_jobs_get_role:
    default: projects/example-databricks-svc/roles/benchmarkDataprocJobsReader # custom role: dataproc.jobs.get

  # --- dashboard ---
  warehouse_id:
    default: 0123456789abcdef # SQL warehouse the Lakeview dashboard runs on

  # --- service principals (run-as). Set to each SP's application id (see prerequisites.md).
  # Separation of duties: runner runs + submits, collector materializes results, analyst builds dashboards. ---
  runner_sp:
    default: 00000000-0000-0000-0000-00000000aaaa # bench-runner
  collector_sp:
    default: 00000000-0000-0000-0000-00000000bbbb # bench-collector
  analyst_sp:
    default: 00000000-0000-0000-0000-00000000cccc # bench-analyst (dashboard owner)

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://1234567890123456.7.gcp.databricks.com
  prod:
    mode: production
    workspace:
      host: https://1234567890123456.7.gcp.databricks.com
