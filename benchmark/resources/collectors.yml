resources:
  jobs:
    # ---- Databricks-side cost collector (run on demand, no schedule) ----
    collect_dbx:
      name: benchmark-collect-dbx
      run_as:
        service_principal_name: ${var.collector_sp}
      job_clusters:
        - job_cluster_key: collector
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: n2-standard-4
            num_workers: 1
      tasks:
        - task_key: collect
          job_cluster_key: collector
          spark_python_task:
            python_file: ../src/collect_dbx.py
            parameters:
              - "--project-tag=${var.project_tag}"
              - "--results-table=${var.results_table}"
              - "--bq-view=${var.bq_billing_view}"
              - "--secret-scope=${var.secret_scope}"
              - "--secret-key=${var.data_collector_secret_key}"
          libraries:
            - pypi:
                package: google-cloud-bigquery

    # ---- Dataproc-side cost collector (run on demand; pass job-name + run-ids at run time) ----
    collect_dataproc:
      name: benchmark-collect-dataproc
      run_as:
        service_principal_name: ${var.collector_sp}
      job_clusters:
        - job_cluster_key: collector
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: n2-standard-4
            num_workers: 1
      tasks:
        - task_key: collect
          job_cluster_key: collector
          spark_python_task:
            python_file: ../src/collect_dataproc.py
            # job-name and run-ids are supplied per invocation, e.g.:
            #   databricks bundle run collect_dataproc -- \
            #     --job-name=etl_daily --run-ids=abc123,def456
            parameters:
              - "--gcp-project=${var.gcp_project}"
              - "--dataproc-region=${var.dataproc_region}"
              - "--results-table=${var.results_table}"
              - "--bq-view=${var.bq_billing_view}"
              - "--secret-scope=${var.secret_scope}"
              - "--secret-key=${var.data_collector_secret_key}"
          libraries:
            - pypi:
                package: google-cloud-dataproc
            - pypi:
                package: google-cloud-bigquery
