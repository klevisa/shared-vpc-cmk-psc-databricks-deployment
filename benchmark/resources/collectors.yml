resources:
  jobs:
    # ---- Cost collector (run on demand, no schedule) ----
    # Keyless: the job cluster runs as the attached collector SA and the code uses
    # Application Default Credentials for BigQuery — no key, no secret scope.
    collect_dbx:
      name: benchmark-collect-dbx
      run_as:
        service_principal_name: ${var.collector_sp}
      job_clusters:
        - job_cluster_key: collector
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: n2-standard-4
            num_workers: 1
            # Cluster policy allow-lists the collector SA (and the node SA).
            policy_id: ${resources.cluster_policies.node_identity.id}
            gcp_attributes:
              # ADC identity for the BigQuery reads — the keyless collector SA.
              google_service_account: ${var.collector_sa}
      tasks:
        - task_key: collect
          job_cluster_key: collector
          spark_python_task:
            python_file: ../src/collect_dbx.py
            parameters:
              - "--project-tag=${var.project_tag}"
              - "--results-table=${var.results_table}"
              - "--coverage-table=${var.photon_coverage_table}"
              - "--bq-view=${var.bq_billing_view}"
              - "--gcp-project=${var.gcp_project}"
          libraries:
            - pypi:
                package: google-cloud-bigquery
