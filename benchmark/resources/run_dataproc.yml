resources:
  jobs:
    # ---- Submit the benchmark file to Dataproc, from Databricks (run on demand) ----
    # bench-runner reads the dataproc-runner SA key, submits the same PySpark file, labels it
    # for cost attribution, and grants the data-collector jobs.get on that job. Prints the
    # run_id to feed collect_dataproc.
    run_dataproc:
      name: benchmark-run-dataproc
      run_as:
        service_principal_name: ${var.runner_sp}
      job_clusters:
        - job_cluster_key: submitter
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: n2-standard-4
            num_workers: 1
      tasks:
        - task_key: submit
          job_cluster_key: submitter
          spark_python_task:
            python_file: ../src/submit_dataproc.py
            parameters:
              - "--gcp-project=${var.gcp_project}"
              - "--dataproc-region=${var.dataproc_region}"
              - "--cluster=${var.dataproc_cluster}"
              - "--pyspark-uri=${var.dataproc_pyspark_uri}"
              - "--job-name=sample_job"
              - "--project-tag=${var.project_tag}"
              - "--data-collector-sa=${var.data_collector_sa}"
              - "--jobs-get-role=${var.dataproc_jobs_get_role}"
              - "--secret-scope=${var.runner_secret_scope}"
              - "--secret-key=${var.dataproc_runner_secret_key}"
          libraries:
            - pypi:
                package: google-cloud-dataproc
